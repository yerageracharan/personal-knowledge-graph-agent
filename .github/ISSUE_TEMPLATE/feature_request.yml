name: Feature request
description: Propose a knowledge-ingestion, graph, or retrieval improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: Source provenance and privacy design
      description: Explain how source evidence is stored and whether content leaves the local machine.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Synthetic fixture and validation plan
    validations:
      required: true
